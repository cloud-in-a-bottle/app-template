# Reusable workflow: runs an app's pytest suite (including OpenhostStack harness tests) on ubuntu.
# Apps call it with:
#
#   jobs:
#     test:
#       uses: cloud-in-a-bottle/app-template/.github/workflows/app-test.yml@main
#
# Podman is set up like on Cloud in a Bottle servers (openhost repo: ansible/tasks/containers.yml): podman from
# conda-forge via pixi, plus the same apt packages, sysctls, registries config, and openhost0 interface. Keep in sync.
name: App tests

on:
  workflow_call:
    inputs:
      pytest-args:
        description: Extra arguments passed to pytest.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

env:
  PODMAN_ENV: ${{ github.workspace }}/../podman-env

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Write podman environment manifest
        run: |
          mkdir -p "$PODMAN_ENV"
          cat > "$PODMAN_ENV/pixi.toml" <<'TOML'
          [workspace]
          name = "podman-env"
          channels = ["conda-forge"]
          platforms = ["linux-64"]

          [dependencies]
          podman = "~=5.8"
          crun = "*"
          TOML

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          manifest-path: ${{ env.PODMAN_ENV }}/pixi.toml

      - name: Configure host for rootless podman
        run: |
          sudo apt-get update
          sudo apt-get remove -y --purge podman crun
          sudo apt-get install -y uidmap passt golang-github-containers-common
          printf 'net.ipv4.ip_unprivileged_port_start = 25\nkernel.apparmor_restrict_unprivileged_userns = 0\nnet.ipv4.ip_forward = 1\n' \
            | sudo tee /etc/sysctl.d/90-openhost-podman.conf
          sudo sysctl -p /etc/sysctl.d/90-openhost-podman.conf
          printf 'unqualified-search-registries = ["docker.io"]\nshort-name-mode = "permissive"\n' \
            | sudo tee /etc/containers/registries.conf

      # pasta shares the host's IP with containers, so app containers reach the router via a dummy interface.
      - name: Create openhost0 dummy interface for container-to-router traffic
        run: |
          sudo ip link add openhost0 type dummy
          sudo ip addr add 10.200.0.1/32 dev openhost0
          sudo ip link set openhost0 up
          mkdir -p ~/.config/containers
          printf '[containers]\nhost_containers_internal_ip = "10.200.0.1"\n' >> ~/.config/containers/containers.conf

      - name: Verify rootless podman works
        run: |
          pixi run --manifest-path "$PODMAN_ENV/pixi.toml" podman --version
          pixi run --manifest-path "$PODMAN_ENV/pixi.toml" podman info --format '{{.Host.Security.Rootless}}' | grep -qx true

      - name: Install playwright chromium
        run: uv run --frozen playwright install --with-deps chromium

      # Run under the podman env so the harness finds podman and its helpers on PATH.
      - name: Run tests
        run: pixi run --manifest-path "$PODMAN_ENV/pixi.toml" uv run --frozen pytest -v ${{ inputs.pytest-args }}

      - name: Dump router and app logs on failure
        if: failure()
        run: |
          find /tmp "$HOME" -name router.log 2>/dev/null | while read -r f; do echo "=== $f ==="; tail -100 "$f"; done
          podman() { pixi run --manifest-path "$PODMAN_ENV/pixi.toml" podman "$@"; }
          for c in $(podman ps -a --format '{{.Names}}'); do echo "=== podman logs $c ==="; podman logs --tail 50 "$c" 2>&1; done
