# Reusable workflow: runs an app's pytest suite (including OpenhostStack harness tests) on ubuntu.
# Apps call it with:
#
#   jobs:
#     test:
#       uses: cloud-in-a-bottle/app-template/.github/workflows/app-test.yml@main
#
# Podman networking setup follows the openhost test harness readme (openhost_app_test_harness/readme.md).
name: App tests

on:
  workflow_call:
    inputs:
      pytest-args:
        description: Extra arguments passed to pytest.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: DEBUG podman via pixi
        run: |
          set -x
          sudo apt-get update
          sudo apt-get remove -y --purge podman crun
          sudo apt-get install -y uidmap passt golang-github-containers-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -fsSL https://pixi.sh/install.sh | bash
          export PATH="$HOME/.pixi/bin:$PATH"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR DBUS=$DBUS_SESSION_BUS_ADDRESS uid=$(id -u)"
          ls -la /run/user/$(id -u) || true
          systemctl --user status 2>&1 | head -5 || true
          mkdir -p /tmp/penv && cd /tmp/penv
          printf '[workspace]\nname = "p"\nchannels = ["conda-forge"]\nplatforms = ["linux-64"]\n\n[dependencies]\npodman = "~=5.8"\ncrun = "*"\n' > pixi.toml
          pixi install
          pixi list | grep -E "podman|crun|runc|conmon|netavark"
          pixi run podman info --format '{{.Host.CgroupManager}} | {{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Path}} | {{.Host.CgroupsVersion}}'
          pixi run podman run --rm docker.io/library/alpine:3 echo PROJECT-ENV-OK || true
          pixi run podman --runtime runc run --rm docker.io/library/alpine:3 echo RUNC-OK || true
          pixi run podman --cgroup-manager cgroupfs run --rm --memory 256m docker.io/library/alpine:3 echo CGROUPFS-MEM-OK || true
          pixi run crun --version
          exit 1

      # pasta shares the host's IP with containers, so app containers reach the router via a dummy interface.
      - name: Create openhost0 dummy interface for container-to-router traffic
        run: |
          sudo ip link add openhost0 type dummy
          sudo ip addr add 10.200.0.1/32 dev openhost0
          sudo ip link set openhost0 up
          mkdir -p ~/.config/containers
          printf '[containers]\nhost_containers_internal_ip = "10.200.0.1"\n' >> ~/.config/containers/containers.conf

      - name: Install playwright chromium
        run: uv run --frozen playwright install --with-deps chromium

      - name: Run tests
        run: uv run --frozen pytest -v ${{ inputs.pytest-args }}

      - name: Dump router and app logs on failure
        if: failure()
        run: |
          find /tmp "$HOME" -name router.log 2>/dev/null | while read -r f; do echo "=== $f ==="; tail -100 "$f"; done
          for c in $(podman ps -a --format '{{.Names}}'); do echo "=== podman logs $c ==="; podman logs --tail 50 "$c" 2>&1; done
