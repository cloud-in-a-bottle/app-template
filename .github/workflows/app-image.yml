# Reusable workflow: builds an app's container image the way the router does (the manifest's [runtime.container]
# image, with the repo root as context), pushes it to registry.cloudinabottle.org/<repo name> tagged with the commit
# sha and the branch, and signs it with cosign keyless (Sigstore, via the job's GitHub OIDC token). The registry only
# accepts pushes from main, on push, workflow_dispatch or schedule events. Apps call it from their ci.yml after the
# tests:
#
#   jobs:
#     image:
#       needs: test
#       if: github.event_name == 'push'
#       uses: cloud-in-a-bottle/app-template/.github/workflows/app-image.yml@main
#       permissions:
#         contents: read
#         id-token: write
#
# The signing certificate names this workflow (not the calling one) and records the calling repo, so verify with:
#
#   cosign verify registry.cloudinabottle.org/<repo>@<digest> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity 'https://github.com/cloud-in-a-bottle/app-template/.github/workflows/app-image.yml@refs/heads/main' \
#     --certificate-github-workflow-repository cloud-in-a-bottle/<repo>
name: App image

on:
  workflow_call:
    outputs:
      image:
        description: The pushed image, without a tag.
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: The pushed (and signed) image digest.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # the registry login, and keyless signing
    outputs:
      image: ${{ steps.login.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Read the Dockerfile path from the app manifest
        id: manifest
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          manifests = [p for p in ("cloudinabottle.toml", "openhost.toml") if pathlib.Path(p).is_file()]
          if not manifests:
              raise SystemExit("no cloudinabottle.toml or openhost.toml at the repo root")
          dockerfile = tomllib.loads(pathlib.Path(manifests[0]).read_text())["runtime"]["container"]["image"]
          if not pathlib.Path(dockerfile).is_file():
              raise SystemExit(f"{manifests[0]}: [runtime.container] image = {dockerfile!r} is not a file")
          print(f"dockerfile={dockerfile}")
          PY

      - id: login
        uses: cloud-in-a-bottle/actions/registry-login@d8a8869a427242308e6fd22754961d1e6e095674  # v1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ steps.manifest.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login.outputs.image }}:${{ github.sha }}
            ${{ steps.login.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # Sign the digest, not a tag: tags are mutable.
      - name: Sign
        env:
          IMAGE: ${{ steps.login.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify the signature
        env:
          IMAGE: ${{ steps.login.outputs.image }}@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/cloud-in-a-bottle/app-template/\.github/workflows/app-image\.yml@' \
            --certificate-github-workflow-repository "$REPOSITORY" > /dev/null
          echo "Pushed and signed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
