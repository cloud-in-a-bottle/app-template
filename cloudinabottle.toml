[app]
name = "app-template"
version = "0.1.0"
# Uncomment once CI tags releases (app-release.yml) so installs track the newest vX.Y.Z tag instead of the
# branch head. Required by [runtime.container] prebuilt_image.
# release_tag_format = "semver"
description = "TODO: one-line description of your app"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"
# Paths that bypass OpenHost auth (the app is otherwise login-gated by the
# router). Uncomment / extend as needed; "/" makes the whole app public.
# public_paths = ["/"]

[resources]
memory_mb = 256
cpu_cores = 0.5

[data]
# Named sqlite databases provisioned + persisted by OpenHost.
# sqlite = ["main"]
# Persistent scratch directory for arbitrary app data (uploads, caches, etc).
# app_data = true
